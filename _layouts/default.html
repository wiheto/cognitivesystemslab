<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body class="{% if page.url == '/' or page.url == '/index.html' %}home-page{% else %}content-page{% endif %}">
  <header class="site-header">
    <div class="header-container">
      <div class="logo-section">
        <span class="logo-icon">🧠</span>
        <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title | upcase }}</a></h1>
      </div>
      <nav class="main-nav">
        <a href="{{ '/news' | relative_url }}">News</a>
        <a href="{{ '/research' | relative_url }}">Research</a>
        <a href="{{ '/members' | relative_url }}">Members</a>
        <a href="{{ '/publications' | relative_url }}">Publications</a>
        <a href="{{ '/about' | relative_url }}">About</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    {% include footer.html %}
  </footer>
</body>
</html>
